# Local run of this agent's image. `plow-agents deploy --local --line ln_xxx`
# mints the credential into ./plow-credentials and brings this up.
services:
  agent:
    build: .
    environment:
      # Which agent this is, for the base's Agent Index reporter. Without it the
      # reporter stands down rather than guessing a name.
      AGENT_ID: watson-delltrak
    env_file:
      - path: ./plow-credentials
        required: false
      # The owner's GitHub token, as one GH_TOKEN=… line. Deploy-time input,
      # never something the agent is told in chat: a texted token is in the
      # model's context and therefore at the inference provider.
      #
      # It does not stay in the environment. 10-watson-stash-token moves it to
      # a root-only file before any service starts and deletes it from here --
      # the gateway shares this container and has a shell, so an env var is one
      # `printenv` from the model. The cycle service stands down, loudly, when
      # it is absent.
      - path: ./watson-github
        required: false
    volumes:
      # The agent's home, kept across `up`/`down` for its sessions and setup.
      # `docker compose down -v` starts this agent fresh, and is what an edit
      # to SOUL.md needs before the agent sees it.
      - agent-home:/var/lib/hermes
    # The agent checkpoints on SIGTERM; its supervisor allows 30s, and Docker's default 10s cuts it off and orphans the transcript lease.
    stop_grace_period: 35s
    # No ports: the agent connects to Plow outbound.

volumes:
  agent-home:
